<main class="page"><a routerLink="/procurement">Back to requisitions</a><h1>{{editing ? 'Edit requisition' : 'Create requisition'}}</h1><p role="status" *ngIf="loading">Loading requisition form…</p><div role="alert" *ngIf="loadError"><p>{{loadError}}</p><button type="button" (click)="load()">Try again</button></div>
<form *ngIf="!loading && !loadError" [formGroup]="form" (ngSubmit)="save()"><label>Requisition number<input formControlName="requisitionNumber" maxlength="40"></label><small *ngIf="form.controls.requisitionNumber.touched && form.controls.requisitionNumber.invalid">Enter a requisition number.</small><label>Title<input formControlName="title" maxlength="180"></label><small *ngIf="form.controls.title.touched && form.controls.title.invalid">Enter a title.</small><label>Justification<textarea formControlName="justification" maxlength="1000"></textarea></label><small *ngIf="form.controls.justification.touched && form.controls.justification.invalid">Enter a justification.</small><label>Needed by<input type="date" formControlName="neededByDate"></label><small *ngIf="form.controls.neededByDate.touched && form.controls.neededByDate.invalid">Choose a date.</small><label *ngIf="!editing">Initial status<select formControlName="statusCode"><option value="">Choose status</option><option *ngFor="let s of options.statuses" [value]="s.code">{{s.name}}</option></select></label><small *ngIf="!editing && form.controls.statusCode.touched && form.controls.statusCode.invalid">Choose an existing status.</small><p role="alert" *ngIf="error">{{error}}</p><button class="primary" type="submit" [disabled]="saving">{{saving ? 'Saving…' : 'Save requisition'}}</button></form></main>
